<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Authentication Required" />
    <meta property="og:description" content="Log in with your EVE Online account to access this resource" />
    <meta property="og:type" content="website" />
    <title>Sign in</title>
    <!-- INCLUDE -->
    <!-- REMOVE THIS LINE IN PROD : REPLACE WITH INTERNALLY HOSTED HTMX COPY DO NOT RELY ON CDN >>> --><script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- END INCLUDE -->
</head>
  <body class=" bg-black">
    <script src="./static/pixel-canvas.js" type="module"></script>
    <!--CONTENT-->
    <style>
      .lelement {
        background-color: #000;
        color: #fff;
        transition: filter 0.3s ease;
      }

      .lelement:hover {
        filter: invert(100%);
      }
    </style>
    <div id="wrapper" class="d-flex justify-content-center align-items-center vh-100">
        <pixel-canvas
          data-gap="15"
          data-speed="25"
          data-colors="#e0f2fe, #7dd3fc, #0ea5e9"
          data-no-focus="true"
        ></pixel-canvas>
        <div class="bg-light p-2 rounded shadow position-absolute z-0">
          <button onclick="handleLogin()" class="p-0 border-0">
            <img src="./static/sso.png" width="300px" class="lelement">
          </button>

          <script>
            function handleLogin() {
              const redirect = new URLSearchParams(window.location.search).get('redirect');
              window.location.href = './dologin' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
            }
          </script>
        </div>

    </div>

    <!--END CONTENT-->
    <!-- BOOTSTRAP INCLUDE -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- BOOTSTRAP INCLUDE -->
</body>
</html>
