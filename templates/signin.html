<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Authentication Required" />
    <meta property="og:description" content="Log in with your EVE Online account to access this resource" />
    <meta property="og:type" content="website" />
    <title>{{ .Name }} - Sign in</title>
</head>
  <body class="bg-eve-bg">
    <script type="module" src="/static/pixel-canvas.js"></script>
    <link rel="stylesheet" href="/static/app.css">

<style>
  @property --p {
    syntax: "<percentage>";
    inherits: false;
    initial-value: 0%;
  }

  .login-box {
    border: none !important;
    background: var(--color-eve-surface);
  }

  .login-box::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(
      135deg,
      var(--color-eve-red) var(--p, 0%),
      var(--color-eve-border) var(--p, 0%)
    );
    z-index: -1;
    transition: --p 0.2s ease-in-out;
  }

  .login-box:has(button:hover)::before {
    --p: 100%;
  }

  .login-overlay {
    position: absolute;
    inset: 0;
    background: var(--color-eve-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .login-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .login-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--color-eve-border);
    border-top-color: var(--color-eve-red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

    <div class="flex flex-col w-[100dvw] h-[100dvh] z-0 items-center justify-center">
      <div class="z-0 absolute w-full h-full top-0 left-0">
          <pixel-canvas
          data-gap="15"
          data-speed="25"
          data-colors="#e0f2fe, #7dd3fc, #0ea5e9"
          data-no-focus="true"
        ></pixel-canvas>
      </div>
      <div class="login-box flex items-center justify-center relative self-center p-2 bg-eve-surface min-h-10 min-w-10 border-eve-border border-2 font-eve text-eve-lg text-eve-bright">
        <button id="loginbtn" class="disabled:invert-25 transition-all duration-150" onclick="handleLogin()">
          <img src="/static/sso.png" height="100px" class="hover:cursor-pointer">
        </button>
        <div class="login-overlay" id="login-overlay">
          <div class="login-spinner"></div>
        </div>
      </div>

    </div>

        <script>
            function handleLogin() {
              document.getElementById("loginbtn").disabled = true
              document.getElementById('login-overlay').classList.add('active');
              const redirect = new URLSearchParams(window.location.search).get('redirect');
              window.location.href = './dologin' + (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');
            }

            window.addEventListener('pageshow', () => {
              document.getElementById('login-overlay').classList.remove('active');
              document.getElementById("loginbtn").disabled = false

            });
          </script>
</body>
</html>
