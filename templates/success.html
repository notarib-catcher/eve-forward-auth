<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Name }} - Logged in!</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
  <body class=" bg-black">
    <script src="./static/pixel-canvas.js" type="module"></script>
    <!--CONTENT-->
    <div id="wrapper" class="d-flex justify-content-center align-items-center vh-100">
          <pixel-canvas
          data-gap="15"
          data-speed="25"
          data-colors="#e0f2fe, #7dd3fc, #0ea5e9"
          data-no-focus="true"
        ></pixel-canvas>
        <div class="bg-light p-2 rounded shadow position-absolute z-0">
          You are logged in. <br>
          <span class="text-primary"> The current character has access to protected services</span>
          <span id="looutboxes>">
            <br><br><button onclick= "window.location.href='/logout'"> Log out </button> of this session<br>
            <button onclick= "window.location.href='/purge'">Log out all </button> sessions with this character.
          </span>
          <b><span id="redirect" class="d-none text-primary"><br><br>You will be automatically redirected...</span></b>
          
        </div> 
        <style>
          .d-none{
            display: none;
          }
        </style>

        <script>
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');

          if (redirect) {
              setTimeout(() => window.location.href = redirect, 3000);
              document.getElementById('redirect').classList.remove('d-none');
          } else {
              
          }
        </script>

    </div>
</body>
</html>
